<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Humor Verification Bureau</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Source+Sans+3:wght@400;600&family=Zilla+Slab:wght@500;600;700&display=swap">
<style>
  :root {
    color-scheme: light dark;
    --paper:   #e8ebe2;
    --form:    #f3f5ee;
    --ink:     #1e2a22;
    --muted:   #4e5d50;
    --rule:    #c3c9b8;
    --stamp:   #a8324a;
    --focus:   #3d6b57;

    --display: "Zilla Slab", Georgia, serif;
    --body:    "Source Sans 3", system-ui, sans-serif;
    --mono:    "IBM Plex Mono", ui-monospace, Menlo, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #171b16;
      --form:  #1f2620;
      --ink:   #e3e8dc;
      --muted: #9aa896;
      --rule:  #3b453a;
      --stamp: #e8617e;
      --focus: #7fbfa1;
    }
  }

  :root[data-theme="dark"] {
    --paper: #171b16;
    --form:  #1f2620;
    --ink:   #e3e8dc;
    --muted: #9aa896;
    --rule:  #3b453a;
    --stamp: #e8617e;
    --focus: #7fbfa1;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--body);
    font-size: 16px;
    line-height: 1.55;
    padding: 3rem 1.25rem 4rem;
    display: flex;
    justify-content: center;
  }

  .form-sheet {
    width: min(40rem, 100%);
    display: flex;
    flex-direction: column;
    gap: 1.75rem;
    background: var(--form);
    border: 1px solid var(--rule);
    box-shadow: inset 0 0 0 1px var(--form), inset 0 0 0 2px var(--rule);
    padding: 2.25rem clamp(1.25rem, 5vw, 2.5rem) 2.5rem;
  }

  header { display: flex; flex-direction: column; gap: .4rem; }

  .bureau {
    font-family: var(--mono);
    font-size: .7rem;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--muted);
  }

  h1 {
    font-family: var(--display);
    font-weight: 700;
    font-size: clamp(1.9rem, 6vw, 2.6rem);
    line-height: 1.1;
    letter-spacing: -.01em;
    margin: 0;
    text-wrap: balance;
  }

  .subtitle {
    font-family: var(--mono);
    font-size: .78rem;
    color: var(--muted);
    border-top: 1px solid var(--rule);
    padding-top: .65rem;
    margin: .35rem 0 0;
  }

  .field { display: flex; flex-direction: column; gap: .5rem; }

  .field-label {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 1rem;
    font-family: var(--mono);
    font-size: .72rem;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--muted);
  }

  textarea {
    width: 100%;
    box-sizing: border-box;
    min-height: 7.5rem;
    padding: .85rem .9rem;
    font-family: var(--body);
    font-size: 1.0625rem;
    line-height: 1.5;
    color: var(--ink);
    background: var(--paper);
    border: 1px solid var(--rule);
    border-radius: 0;
    resize: vertical;
  }

  textarea:focus-visible,
  button:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
  }

  .note { font-size: .85rem; color: var(--muted); margin: 0; }

  .actions { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }

  button {
    font-family: var(--display);
    font-weight: 600;
    font-size: 1rem;
    letter-spacing: .02em;
    color: var(--form);
    background: var(--ink);
    border: 1px solid var(--ink);
    border-radius: 0;
    padding: .7rem 1.6rem;
    cursor: pointer;
    transition: background .15s ease, color .15s ease;
  }

  button:hover:not(:disabled) { background: var(--stamp); border-color: var(--stamp); }
  button:disabled { background: transparent; color: var(--muted); border-color: var(--rule); cursor: progress; }

  .verdict {
    border-top: 1px solid var(--rule);
    padding-top: 1.5rem;
    min-height: 8.5rem;
    display: flex;
    align-items: center;
  }

  .awaiting, .thinking {
    font-family: var(--mono);
    font-size: .82rem;
    letter-spacing: .06em;
    color: var(--muted);
  }

  .thinking { display: flex; flex-direction: column; gap: .75rem; width: 100%; }

  .meter {
    height: 3px;
    background: var(--rule);
    overflow: hidden;
    position: relative;
  }

  .meter::after {
    content: "";
    position: absolute;
    inset: 0 auto 0 0;
    width: 34%;
    background: var(--stamp);
    animation: sweep 1.1s ease-in-out infinite;
  }

  @keyframes sweep {
    0%   { transform: translateX(-105%); }
    100% { transform: translateX(300%); }
  }

  .stamp {
    width: 100%;
    border: 3px double var(--stamp);
    color: var(--stamp);
    padding: 1.1rem 1.25rem 1rem;
    transform: rotate(-2.2deg);
    display: flex;
    flex-direction: column;
    gap: .5rem;
    animation: land .45s cubic-bezier(.2, 1.5, .4, 1) both;
  }

  @keyframes land {
    from { transform: rotate(-11deg) scale(1.5); opacity: 0; }
    to   { transform: rotate(-2.2deg) scale(1); opacity: 1; }
  }

  .stamp-verdict {
    font-family: var(--display);
    font-weight: 700;
    font-size: clamp(1.05rem, 3.6vw, 1.35rem);
    line-height: 1.25;
    letter-spacing: .01em;
    text-transform: uppercase;
    text-wrap: balance;
  }

  .stamp-meta {
    display: flex;
    flex-wrap: wrap;
    gap: .25rem 1.5rem;
    font-family: var(--mono);
    font-size: .68rem;
    letter-spacing: .08em;
    text-transform: uppercase;
    font-variant-numeric: tabular-nums;
    border-top: 1px solid var(--stamp);
    padding-top: .5rem;
  }

  footer {
    font-family: var(--mono);
    font-size: .68rem;
    letter-spacing: .06em;
    color: var(--muted);
    border-top: 1px solid var(--rule);
    padding-top: .9rem;
  }

  @media (prefers-reduced-motion: reduce) {
    .stamp { animation: none; }
    .meter::after { animation: none; width: 100%; }
  }
</style>
</head>
<body>
<main class="form-sheet">
  <header>
    <p class="bureau">Bureau of Humor Verification</p>
    <h1>Humor Validator</h1>
    <p class="subtitle">Form HV&#8209;1 &middot; Specimen evaluation &amp; certification</p>
  </header>

  <div class="field">
    <div class="field-label">
      <label for="specimen">Specimen text</label>
      <span id="count">0 characters</span>
    </div>
    <textarea id="specimen" placeholder="Enter the material to be evaluated&hellip;">I told my wife she was drawing her eyebrows too high. She looked surprised.</textarea>
    <p class="note">Sample specimen pre-loaded. Evaluated on setup, timing, and payload delivery.</p>
  </div>

  <div class="actions">
    <button id="validate" type="button">validate humor</button>
  </div>

  <section class="verdict" id="verdict" role="status" aria-live="polite">
    <p class="awaiting">Awaiting specimen.</p>
  </section>

  <footer>Certifications issued by the Bureau are final and non&#8209;appealable.</footer>
</main>

<script>
  var specimen = document.getElementById("specimen");
  var count = document.getElementById("count");
  var button = document.getElementById("validate");
  var verdict = document.getElementById("verdict");
  var serial = 0;

  function updateCount() {
    var n = specimen.value.length;
    count.textContent = n + (n === 1 ? " character" : " characters");
  }

  specimen.addEventListener("input", updateCount);
  updateCount();

  function certificateNumber() {
    serial += 1;
    var year = new Date().getFullYear();
    return "HV-" + year + "-" + String(serial).padStart(4, "0");
  }

  function issuedAt() {
    return new Date().toLocaleString(undefined, {
      year: "numeric", month: "short", day: "2-digit",
      hour: "2-digit", minute: "2-digit"
    });
  }

  button.addEventListener("click", function () {
    button.disabled = true;

    verdict.innerHTML = "";
    var pending = document.createElement("div");
    pending.className = "thinking";
    var label = document.createElement("span");
    label.textContent = "thinking...";
    var meter = document.createElement("div");
    meter.className = "meter";
    pending.appendChild(label);
    pending.appendChild(meter);
    verdict.appendChild(pending);

    setTimeout(function () {
      verdict.innerHTML = "";

      var stamp = document.createElement("div");
      stamp.className = "stamp";

      var line = document.createElement("p");
      line.className = "stamp-verdict";
      line.textContent = "CONGRATULATIONS: that is confirmed to be funny";

      var meta = document.createElement("div");
      meta.className = "stamp-meta";

      var no = document.createElement("span");
      no.textContent = "Certificate " + certificateNumber();
      var when = document.createElement("span");
      when.textContent = "Issued " + issuedAt();
      var who = document.createElement("span");
      who.textContent = "Examiner: Automated Panel";

      meta.appendChild(no);
      meta.appendChild(when);
      meta.appendChild(who);

      stamp.appendChild(line);
      stamp.appendChild(meta);
      verdict.appendChild(stamp);

      button.disabled = false;
    }, 3000);
  });
</script>
</body>
</html>
